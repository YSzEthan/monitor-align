name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: scripts/build-app.sh
      - name: Selftest
        run: build/MonitorAlign.app/Contents/MacOS/monitor-align --selftest
