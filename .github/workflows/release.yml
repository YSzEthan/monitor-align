name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 升級哪一位版號
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  pull-requests: read
# 同一個 group 只保留一個排隊：連續三個 merge 時，中間 pending 的會被取消，
# 它的內容併入下一版，但它 PR 上的 minor／major 標籤會丟失。
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # dispatch 可以從任何分支觸發；只准從 main 發版，避免把沒合併的程式發成 latest
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # 預設淺 clone 抓不到 tag，版號每次都會算成 v0.1.0

      - name: 決定版號
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          # 這個 commit 已經發過版（重跑、dispatch）就結束
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            echo "這個 commit 已有版號 tag，不重複發版"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          bump="patch"
          if [ "$EVENT" = workflow_dispatch ]; then
            bump=$INPUT_BUMP
          else
            # merge 後立刻查，PR 關聯可能還沒建好而回空陣列：重試，仍空就當 patch
            prs='[]'
            for _ in 1 2 3; do
              prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")]')
              [ "$(jq length <<<"$prs")" -gt 0 ] && break
              sleep 5
            done
            labels=$(jq -r '[.[].labels[].name] | join(" ")' <<<"$prs")
            case " $labels " in
              *" no-release "*) echo "PR 有 no-release 標籤，不發版"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *" major "*) bump=major ;;
              *" minor "*) bump=minor ;;
            esac
          fi

          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "最新版 ${latest:-（無）}，$bump → v$version"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build-app.sh

      - name: Selftest
        if: steps.ver.outputs.skip != 'true'
        run: build/MonitorAlign.app/Contents/MacOS/monitor-align --selftest

      - name: 打包並發版
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          zip="MonitorAlign-v$VERSION-arm64.zip"
          mkdir dist
          ditto -c -k --keepParent build/MonitorAlign.app "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
          # tag 最後才建：上面任何一步失敗都不會留下沒有 release 的孤兒 tag。
          # 用 GITHUB_TOKEN 建的 tag 不會再觸發 workflow，所以不會迴圈。
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            "dist/$zip" "dist/$zip.sha256"
