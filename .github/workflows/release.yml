name: release
# dev 合併 → beta（prerelease，vX.Y.Z-beta.N）；main 合併（dev→main）→ stable（vX.Y.Z）。
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bump:
        description: 升級哪一位版號
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  pull-requests: read
# 每條分支各一個 group：共用時，排隊中的 main（stable）run 會被後來的 dev push 取消，整次 stable 就沒了。
# 同一條分支連續三個 merge 時，中間排隊的會被取消，內容併入下一版，但它 PR 上的 minor／major 標籤會丟失。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    # dispatch 可以從任何分支觸發；只准從 main／dev 發版，避免把沒合併的程式發出去
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # 預設淺 clone 抓不到 tag，版號會算錯

      - name: 決定版號
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          # 這個 commit 在這條通道已經發過版（重跑、dispatch）就結束。分通道判斷：
          # dev→main 若用 fast-forward／rebase 合併，SHA 與 dev 相同，已有 beta tag 但還沒有 stable。
          if [ "$CHANNEL" = main ]; then pat='^v[0-9]+\.[0-9]+\.[0-9]+$'; else pat='-beta\.[0-9]+$'; fi
          if git tag --points-at "$GITHUB_SHA" | grep -Eq "$pat"; then
            echo "這個 commit 已有 $CHANNEL 通道的版號 tag，不重複發版"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          bump="patch"
          if [ "$EVENT" = workflow_dispatch ]; then
            bump=$INPUT_BUMP
          else
            # merge 後立刻查，PR 關聯可能還沒建好而回空陣列：重試，仍空就當 patch
            for _ in 1 2 3; do
              prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq "[.[] | select(.merged_at != null and .base.ref == \"$CHANNEL\")]")
              [ "$(jq length <<<"$prs")" -gt 0 ] && break
              sleep 5
            done
            labels=$(jq -r '[.[].labels[].name] | join(" ")' <<<"$prs")
            case " $labels " in
              *" no-release "*) echo "PR 有 no-release 標籤，不發版"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *" major "*) bump=major ;;
              *" minor "*) bump=minor ;;
            esac
          fi

          scripts/next-version.sh "$CHANNEL" "$bump" <<<"$(git tag -l 'v*')" | tee -a "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: scripts/build-app.sh

      - name: Selftest
        if: steps.ver.outputs.skip != 'true'
        run: build/MonitorAlign.app/Contents/MacOS/monitor-align --selftest

      - name: 打包並發版
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          LATEST_STABLE: ${{ steps.ver.outputs.LATEST_STABLE }}
        run: |
          set -eu
          zip="MonitorAlign-v$VERSION-arm64.zip"
          mkdir dist
          ditto -c -k --keepParent build/MonitorAlign.app "dist/$zip"
          dmg="MonitorAlign-v$VERSION-arm64.dmg"
          scripts/make-dmg.sh build/MonitorAlign.app "dist/$dmg"
          (cd dist && for f in "$zip" "$dmg"; do shasum -a 256 "$f" > "$f.sha256"; done)
          if [ "$CHANNEL" = main ]; then
            # stable 的 notes 從上一個 stable 算起，不然只會從最近一個 beta 開始
            flags=(--latest)
            [ -n "$LATEST_STABLE" ] && flags+=(--notes-start-tag "$LATEST_STABLE")
          else
            flags=(--prerelease)
          fi
          # tag 最後才建：上面任何一步失敗都不會留下沒有 release 的孤兒 tag。
          # 用 GITHUB_TOKEN 建的 tag 不會再觸發 workflow，所以不會迴圈。
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            "${flags[@]}" "dist/$zip" "dist/$zip.sha256" "dist/$dmg" "dist/$dmg.sha256"
